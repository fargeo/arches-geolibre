name: Publish site

# Publishes https://fargeo.github.io/arches-geolibre/ (scripts/build-pages-site.sh):
# GeoLibre's web app with the plugin preinstalled at /app/, a landing page,
# and the plugin itself (plugin.json, dist/ and the zip) for adding to other
# GeoLibre sites. GitHub Pages sends the CORS headers GeoLibre needs to fetch
# the manifest.
on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: The tag matches plugin.json's version
              if: github.ref_type == 'tag'
              run: |
                  manifest_version="$(node -p "require('./geolibre-plugin/plugin.json').version")"
                  test "v$manifest_version" = "$GITHUB_REF_NAME"
            - run: scripts/build-pages-site.sh
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
